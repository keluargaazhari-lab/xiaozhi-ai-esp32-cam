name: Build esp32s3-cam-st7789
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sisakan hanya board kamu
        run: |
          cd main/boards
          find . -mindepth 1 -maxdepth 1 ! -name common ! -name esp32s3-cam-st7789 -exec rm -rf {} +
          ls
      - name: Build
        run: |
          docker run --rm -v "$PWD:/project" -w /project -e HOME=/tmp espressif/idf:v5.5.1 \
            bash -c "git config --global --add safe.directory '*' && python3 scripts/build.py esp32s3-cam-st7789 --name esp32s3-cam-st7789-240x280"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: releases/
