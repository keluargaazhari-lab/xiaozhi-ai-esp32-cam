name: Build esp32s3-cam-st7789
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          command: python scripts/build.py esp32s3-cam-st7789 --name esp32s3-cam-st7789-240x280
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: releases/
